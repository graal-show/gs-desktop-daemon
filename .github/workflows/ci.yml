name: rust-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned common desktop runtime
        uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: 981417bc97ef6932a1ce23827386b94cd301a367
          path: tmp/dev/ores-common-desktop-infra
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned common desktop runtime
        shell: bash
        run: test "$(git -C tmp/dev/ores-common-desktop-infra rev-parse HEAD)" = "981417bc97ef6932a1ce23827386b94cd301a367"
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - name: Prepare dependency lock for audit
        shell: bash
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo +1.90.0 fetch --locked
          else
            cargo +1.90.0 generate-lockfile
          fi
      - name: Publish generated lock candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cargo-lock-candidate
          path: Cargo.lock
          if-no-files-found: error
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --locked --all-targets
      - name: Require committed deterministic lockfile
        shell: bash
        run: |
          git ls-files --error-unmatch Cargo.lock >/dev/null
          git diff --exit-code -- Cargo.lock
