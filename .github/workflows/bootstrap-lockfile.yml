name: bootstrap-lockfile

on:
  push:
    branches:
      - hardening/reusable-jvm-cell-boundary-v1

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/reusable-jvm-cell-boundary-v1
          fetch-depth: 0
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
      - name: Generate deterministic lockfile
        run: cargo +1.90.0 generate-lockfile
      - name: Commit lockfile if absent or changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: commit deterministic Cargo.lock"
          git push origin HEAD:hardening/reusable-jvm-cell-boundary-v1
