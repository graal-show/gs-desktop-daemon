[help]
url = "https://github.com/graal-show/gs-desktop-daemon"
columns = ["options", "env", "type", "default", "description"]

[parse]
stop_at_first_positional = false
allow_unknown = false

[flags.listen]
env = "GS_DESKTOP_ADDR"
aliases = ["listen"]
type = "string"
default = "127.0.0.1:8764"
help = "Loopback listen address for the desktop daemon."

[flags.java]
env = "GS_JAVA_COMMAND"
aliases = ["java"]
type = "string"
default = "java"
help = "Allowlisted Java/Graal runtime executable."

[flags.main-class]
env = "GS_CELL_MAIN_CLASS"
aliases = ["main-class"]
type = "string"
default = "dev.graalshow.lambda.CellMain"
help = "Pinned Graal tenant-cell main class."

[flags.artifact-root]
env = "GS_ARTIFACT_ROOT"
aliases = ["artifact-root"]
type = "string"
help = "Root containing immutable <tenant>/<deployment>/gs-lambda-cell.jar, manifest.json, and guest sources."

[flags.max-parallel]
env = "GS_MAX_PARALLEL_INVOCATIONS"
aliases = ["max-parallel"]
type = "integer"
default = 256
help = "Maximum concurrent invocations admitted by this daemon."

[flags.max-cell-invocations]
env = "GS_MAX_CELL_INVOCATIONS"
aliases = ["max-cell-invocations"]
type = "integer"
default = 100000
help = "Drain and recycle a warm Graal cell after this many admitted invocations."

[flags.max-live-cells]
env = "GS_MAX_LIVE_CELLS"
aliases = ["max-live-cells"]
type = "integer"
default = 256
help = "Maximum simultaneously resident tenant+deployment process cells."

[flags.max-cells-per-generation]
env = "GS_MAX_CELLS_PER_GENERATION"
aliases = ["max-cells-per-generation"]
type = "integer"
default = 4
help = "Maximum warm process cells for one tenant+deployment generation."

[flags.max-cell-concurrency]
env = "GS_MAX_CELL_CONCURRENCY"
aliases = ["max-cell-concurrency"]
type = "integer"
default = 16
help = "Maximum concurrent invocations multiplexed through one tenant process cell."

[flags.cell-idle-ttl-ms]
env = "GS_CELL_IDLE_TTL_MS"
aliases = ["cell-idle-ttl-ms"]
type = "integer"
default = 300000
help = "Retire an idle tenant process cell after this many milliseconds."

[flags.max-cell-age-ms]
env = "GS_MAX_CELL_AGE_MS"
aliases = ["max-cell-age-ms"]
type = "integer"
default = 3600000
help = "Recycle a warm tenant process cell after this maximum age in milliseconds."

[flags.max-stateless-isolates]
env = "GS_MAX_STATELESS_ISOLATES"
aliases = ["max-stateless-isolates"]
type = "integer"
default = 2
help = "Pre-warmed stateless Polyglot Engine/isolate slots in each tenant process."

[flags.max-contexts-per-isolate]
env = "GS_MAX_CONTEXTS_PER_ISOLATE"
aliases = ["max-contexts-per-isolate"]
type = "integer"
default = 8
help = "Maximum concurrent request Contexts admitted inside one route/stateless Polyglot isolate."

[flags.max-route-isolates]
env = "GS_MAX_ROUTE_ISOLATES"
aliases = ["max-route-isolates"]
type = "integer"
default = 128
help = "Maximum warm route-affinity isolates in one tenant process."

[flags.max-session-isolates]
env = "GS_MAX_SESSION_ISOLATES"
aliases = ["max-session-isolates"]
type = "integer"
default = 1024
help = "Maximum warm user/session-affinity isolates in one tenant process."

[flags.max-route-session-isolates]
env = "GS_MAX_ROUTE_SESSION_ISOLATES"
aliases = ["max-route-session-isolates"]
type = "integer"
default = 2048
help = "Maximum composite route+session affinity isolates in one tenant process."

[flags.session-isolate-ttl-ms]
env = "GS_SESSION_ISOLATE_TTL_MS"
aliases = ["session-isolate-ttl-ms"]
type = "integer"
default = 300000
help = "Idle TTL for session and route_session isolates; default is five minutes."

[flags.route-isolate-ttl-ms]
env = "GS_ROUTE_ISOLATE_TTL_MS"
aliases = ["route-isolate-ttl-ms"]
type = "integer"
default = 3600000
help = "Idle TTL for route-affinity isolates before reclamation."

[flags.max-isolate-memory]
env = "GS_MAX_ISOLATE_MEMORY"
aliases = ["max-isolate-memory"]
type = "string"
default = "256MB"
help = "Maximum memory for one Polyglot isolate."

[flags.max-guest-heap-memory]
env = "GS_MAX_GUEST_HEAP_MEMORY"
aliases = ["max-guest-heap-memory"]
type = "string"
default = "128MB"
help = "Maximum guest heap per sandboxed Context."

[flags.max-guest-cpu-time-ms]
env = "GS_MAX_GUEST_CPU_TIME_MS"
aliases = ["max-guest-cpu-time-ms"]
type = "integer"
default = 30000
help = "Maximum guest CPU time per invocation; request deadlines may lower this value."

[flags.max-ast-depth]
env = "GS_MAX_AST_DEPTH"
aliases = ["max-ast-depth"]
type = "integer"
default = 100
help = "Maximum guest AST depth required by the UNTRUSTED sandbox profile."

[flags.max-guest-threads]
env = "GS_MAX_GUEST_THREADS"
aliases = ["max-guest-threads"]
type = "integer"
default = 1
help = "Maximum guest-created threads per Context."

[flags.max-guest-stdout]
env = "GS_MAX_GUEST_STDOUT"
aliases = ["max-guest-stdout"]
type = "string"
default = "1MB"
help = "Maximum sandboxed guest stdout captured per Context."

[flags.max-guest-stderr]
env = "GS_MAX_GUEST_STDERR"
aliases = ["max-guest-stderr"]
type = "string"
default = "1MB"
help = "Maximum sandboxed guest stderr captured per Context."

[flags.isolate-mode]
env = "GS_ISOLATE_MODE"
aliases = ["isolate-mode"]
type = "string"
default = "internal"
help = "Polyglot isolate mode: internal or external. External intentionally changes process topology."

[flags.token-file]
env = "GS_DESKTOP_TOKEN_FILE"
aliases = ["token-file"]
type = "string"
help = "Optional local bearer-token file path; token values are never argv."

[flags.log]
env = "GS_DESKTOP_LOG"
aliases = ["log"]
type = "string"
default = "gs_desktop_daemon=info"
help = "Tracing filter for the desktop daemon."
